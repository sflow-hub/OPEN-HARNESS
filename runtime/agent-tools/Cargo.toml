[package]
name = "open-harness-agent-tools"
version = "0.4.0-beta.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
