[package]
name = "open-harness-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
axum = "0.8"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
icu_collator = "2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
