name: open-harness
services:
  docker:
    image: ${OPEN_HARNESS_ENGINE_IMAGE:-docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0}
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
      DOCKER_HOST: unix:///run/open-harness-docker/docker.sock
    entrypoint: ["/bin/sh", "/usr/local/bin/open-harness-dind.sh"]
    # Supplying dockerd explicitly prevents the upstream entrypoint adding TCP.
    command: ["dockerd", "--host=unix:///run/open-harness-docker/docker.sock", "--group=1000"]
    networks: [runtime]
    volumes:
      - harness-docker:/var/lib/docker
      - harness-data:/data
      - harness-control:/run/open-harness-docker
      - ./runtime/dind-entrypoint.sh:/usr/local/bin/open-harness-dind.sh:ro
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 30s

  open-harness:
    init: true
    image: ${OPEN_HARNESS_COORDINATOR_IMAGE:-open-harness-coordinator:local}
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///run/open-harness-docker/docker.sock
      OPEN_HARNESS_STATE_DIR: /data
      OPEN_HARNESS_PUBLIC_URL: ${OPEN_HARNESS_PUBLIC_URL:-http://localhost:3000/api/local}
      OPEN_HARNESS_ALLOW_REMOTE_DASHBOARD: ${OPEN_HARNESS_ALLOW_REMOTE_DASHBOARD:-0}
      OPEN_HARNESS_REQUIRE_BROWSER_PAIRING: "1"
      OPEN_HARNESS_DEPLOYMENT: compose
      OPEN_HARNESS_HERMES_IMAGE: ${OPEN_HARNESS_HERMES_IMAGE:-open-harness-hermes:2026.9.11}
      OPEN_HARNESS_HERMES_PULL: ${OPEN_HARNESS_HERMES_PULL:-0}
    volumes:
      - harness-data:/data
      - harness-control:/run/open-harness-docker
    ports:
      - "${OPEN_HARNESS_LISTEN_ADDRESS:-127.0.0.1}:3000:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Same pass/fail semantics as curl -fsS (no redirects; HTTP >= 400 or transport error fails).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{redirect:'manual'}).then(async r=>{const b=await r.text();if(r.status>=400)throw new Error('HTTP '+r.status);process.stdout.write(b)}).then(()=>process.exit(0),e=>{console.error(e.message);process.exit(1)})"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  harness-data:
  harness-docker:
  harness-control:

# The untrusted nested agents must not reach the dashboard bootstrap endpoint.
# The coordinator uses the socket volume, so it needs no runtime-network access.
networks:
  runtime:
  default:
