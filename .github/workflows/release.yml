name: Self-hosted beta release

on:
  push:
    tags: ['v*-beta.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to point at main
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Require the tag to match the application version
        run: test "$GITHUB_REF_NAME" = "v$(node -p \"require('./package.json').version\")"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker compose config --quiet
      - name: Scan the source tree for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
      - name: Build coordinator image
        run: docker build -f Dockerfile.coordinator -t open-harness-coordinator:release-candidate .
      - name: Scan coordinator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: open-harness-coordinator:release-candidate
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Smoke test fresh Compose stack
        run: |
          cleanup() { docker compose down -v; }
          trap cleanup EXIT
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then docker compose logs open-harness; exit 1; fi
            sleep 2
          done
          test "$(curl -sS -o /tmp/remote-bootstrap.json -w '%{http_code}' -H 'Host: agents.example.com' http://127.0.0.1:3000/api/local/v1/bootstrap)" = 403

  hermes-image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/hermes/Dockerfile
          load: true
          tags: open-harness-hermes:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan Hermes image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: open-harness-hermes:release-candidate
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned Hermes image
        run: |
          docker tag open-harness-hermes:release-candidate ghcr.io/${{ github.repository_owner }}/open-harness-hermes:${{ github.ref_name }}
          docker tag open-harness-hermes:release-candidate ghcr.io/${{ github.repository_owner }}/open-harness-hermes:2026.9.11
          docker push ghcr.io/${{ github.repository_owner }}/open-harness-hermes:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/open-harness-hermes:2026.9.11

  publish:
    needs: [verify, hermes-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:package -- release-assets
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum open-harness-self-hosted-*.tar.gz > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --generate-notes --title "Open Harness ${GITHUB_REF_NAME}"
