name: Real container runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OPEN_HARNESS_HERMES_IMAGE: open-harness-hermes:ci
      OPEN_HARNESS_REAL_CONTAINER: '1'
      OPEN_HARNESS_DISABLE_OS_VAULT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Docker daemon
        run: docker info
      - name: Build the pinned production Hermes image
        timeout-minutes: 55
        run: npm run harness:setup
      - name: Exercise real private-container runs without cloud credentials
        timeout-minutes: 6
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --import tsx tests/real-hermes-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/runtime-smoke.log"
      - name: Collect fixture evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-container-runtime-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/runtime-smoke.log
            ${{ runner.temp }}/open-harness-real-smoke-*/evidence.json
            ${{ runner.temp }}/open-harness-real-smoke-*/diagnostics.json
      - name: Remove only smoke-test containers
        if: always()
        run: docker ps -aq --filter 'name=^/open-harness-real-smoke-' | xargs -r docker rm -f
