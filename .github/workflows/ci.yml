name: Verify

on:
  pull_request:
  push:
    branches: [main, codex/browser-release-candidate]

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Check runtime package verification on Linux
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s tests/ubuntu-runtime -v
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: node desktop/fetch-node.mjs ${{ matrix.target }}
      - run: npm run desktop:prepare
      - run: npx tauri build --debug --no-bundle --target ${{ matrix.target }}

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  native-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --locked --workspace
      - name: Verify native harness protocols and worker recovery
        run: |
          cargo build --locked --workspace
          OPEN_HARNESS_RUST_RUNNER="$PWD/target/debug/open-harness-runner" node --test runtime/rust-runner/tests/harnesses.test.mjs runtime/rust-runner/tests/adoption.test.mjs runtime/rust-runner/tests/recovery.test.mjs
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Verify the native dashboard with JavaScript disabled
        if: runner.os == 'Linux'
        run: npx playwright test --config playwright.native.config.ts
