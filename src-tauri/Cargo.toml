[package]
name = "open-harness-desktop"
version = "0.3.0"
description = "The no-terminal desktop installer for Open Harness"
edition = "2021"
license = "MIT"

# Mobile targets build a library and call run() through tauri::mobile_entry_point, so the
# real entry point lives in lib.rs and main.rs is a shim for desktop builds.
[lib]
name = "open_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde_json = "1"

# Desktop only. The tray lives in the menu bar, single-instance focuses an existing window,
# the updater ships signed desktop bundles, and the shell plugin spawns the Node sidecars.
# None of these exist on a phone, and several fail to compile for Android at all.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.9.0"
# Hands off-origin links to the user's browser. tauri-plugin-shell's open() is
# deprecated and tauri-plugin-opener would be a whole plugin for one call; this is
# the crate both of them wrap, and it is already in the dependency graph.
open = "5"

# Mobile only. The phone has no server of its own, so every capability it needs comes from
# a plugin: HTTPS to its hub, storage for the pairing, and the camera to scan a pairing code.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-http = "2.6.1"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
sha2 = "0.10"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-ime-insets = { path = "plugins/ime-insets" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package.scrypt]
opt-level = 3
